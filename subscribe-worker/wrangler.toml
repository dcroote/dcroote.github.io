name = "derekcroote-subscribe"
main = "src/worker.ts"
compatibility_date = "2026-08-08"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://www.derekcroote.com"
TURNSTILE_HOSTNAME = "www.derekcroote.com"
TURNSTILE_ACTION = "newsletter_subscribe"
BUTTONDOWN_API_URL = "https://api.buttondown.com/v1/subscribers"

[[ratelimits]]
name = "SUBSCRIBE_RATE_LIMITER"
namespace_id = "1819"

  [ratelimits.simple]
  limit = 5
  period = 60
